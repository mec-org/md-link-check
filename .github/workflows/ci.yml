name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repo on GitHub-hosted runners: nothing here runs on the owner's machine,
# and the job's token can only read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (no install scripts)
        run: |
          [ -f package.json ] || exit 0
          npm ci --ignore-scripts
      - name: Test
        run: |
          [ -f package.json ] || exit 0
          npm test
